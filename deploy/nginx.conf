# deploy/nginx.conf
#
# Nginx reverse-proxy for Karar Bot – single-server production setup.
# Tested with Nginx 1.24+ on Ubuntu 24.04 LTS.
#
# Place this file at:
#   /etc/nginx/sites-available/karar-bot
# Then:
#   ln -s /etc/nginx/sites-available/karar-bot /etc/nginx/sites-enabled/karar-bot
#   nginx -t && systemctl reload nginx
#
# SSL certificates are managed by Certbot (see deploy/init-letsencrypt.sh).
# After running Certbot, it will append/replace the SSL server block automatically.
# ──────────────────────────────────────────────────────────────────────────────

# ── Rate limiting zone ────────────────────────────────────────────────────────
# 10 MB zone ≈ ~160 000 IP addresses.  Each IP limited to 30 req/s burst.
# Telegram sends webhook updates from a range of known IPs; this protects
# against accidental floods from other sources.
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
# NOTE: The placeholder "YOUR_DOMAIN" appears in multiple places in this file.
# Replace ALL occurrences with your actual domain name before activating.
# The deploy/deploy_single_server.sh script does this automatically via sed.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;          # ← replace with your actual domain

    # Let's Encrypt ACME challenge (Certbot needs this)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS – main webhook server ──────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;          # ← replace with your actual domain

    # ── SSL – filled in by Certbot ─────────────────────────────────────────
    # Certbot will add/manage the ssl_certificate lines below.
    # Uncomment and update once Certbot has run:
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options           DENY            always;
    add_header X-Content-Type-Options    nosniff         always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           no-referrer     always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Limits ────────────────────────────────────────────────────────────
    client_max_body_size 10m;          # Telegram updates are small; 10 MB is safe overhead

    # ── Telegram webhook endpoint ──────────────────────────────────────────
    # Must match WEBHOOK_PATH in .env (default: /telegram/webhook)
    location /telegram/webhook {
        limit_req zone=webhook_limit burst=60 nodelay;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Telegram expects a timely 200 OK; keep timeouts tight.
        proxy_connect_timeout 10s;
        proxy_send_timeout    15s;
        proxy_read_timeout    30s;

        # No buffering – forward immediately to the bot process.
        proxy_buffering    off;
        proxy_request_buffering off;
    }

    # ── Health / readiness endpoints (restrict to localhost or monitoring IPs) ─
    # The bot exposes /healthz, /readyz, /queuez on port 8081 (HEALTHCHECK_PORT).
    # Expose them through Nginx only if you need external monitoring access.
    # By default they are accessible only from localhost.
    location /healthz {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8081/healthz;
        proxy_set_header Host $host;
    }

    location /readyz {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8081/readyz;
        proxy_set_header Host $host;
    }

    location /queuez {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8081/queuez;
        proxy_set_header Host $host;
    }

    # ── Block everything else ─────────────────────────────────────────────
    location / {
        return 404;
    }
}

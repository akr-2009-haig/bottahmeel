services:
  - type: web
    name: karar-bot-webhook
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run_bot.py
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: BOT_MODE
        value: webhook
      - key: BOT_LISTEN_HOST
        value: 0.0.0.0
      - key: PORT
        sync: false
      - key: WEBHOOK_PATH
        value: /telegram/webhook
      - key: QUEUE_BACKEND
        value: redis
      - key: ENABLE_HEALTHCHECK
        value: "false"
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_OWNER_ID
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: karar-bot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: karar-bot-redis
          property: connectionString

  - type: worker
    name: karar-bot-worker
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run_bot.py worker
    autoDeploy: true
    envVars:
      - key: BOT_MODE
        value: worker
      - key: QUEUE_BACKEND
        value: redis
      - key: ENABLE_HEALTHCHECK
        value: "false"
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_OWNER_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: karar-bot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: karar-bot-redis
          property: connectionString

  - type: redis
    name: karar-bot-redis
    plan: starter
    ipAllowList: []


databases:
  - name: karar-bot-db
    plan: free

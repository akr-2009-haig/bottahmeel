services:
  bot:
    build: .
    command: python run_bot.py
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - bot_temp:/tmp/karar-bot
      # Mount your real cookies file.  Copy cookies.txt.example → cookies.txt,
      # fill it with your browser cookies, then set COOKIES_FILE=./cookies.txt in .env.
      # If COOKIES_FILE is not set the container expects ./cookies.txt to exist.
      - ${COOKIES_FILE:-./cookies.txt}:/app/cookies/cookies.txt:ro
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    cpus: "0.75"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  worker:
    build: .
    command: python run_bot.py worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bot_temp:/tmp/karar-bot
      # Mount your real cookies file.  Copy cookies.txt.example → cookies.txt,
      # fill it with your browser cookies, then set COOKIES_FILE=./cookies.txt in .env.
      # If COOKIES_FILE is not set the container expects ./cookies.txt to exist.
      - ${COOKIES_FILE:-./cookies.txt}:/app/cookies/cookies.txt:ro
    mem_limit: 3g
    cpus: "1.25"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karar_bot}
      POSTGRES_USER: ${POSTGRES_USER:-karar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karar_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karar} -d ${POSTGRES_DB:-karar_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: "0.5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 1g
    cpus: "0.25"

volumes:
  postgres_data:
  redis_data:
  bot_temp:

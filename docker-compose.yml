services:
  bot:
    build: .
    command: python run_bot.py
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
      - "8081:8081"

  worker:
    build: .
    command: python run_bot.py worker
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: karar_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
